apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-analytics-api
  labels:
    app: voyage-analytics-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voyage-analytics-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: voyage-analytics-api
    spec:
      containers:
        - name: api
          image: voyage-analytics-api:latest # Replace with your registry/image:tag in CI/CD.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 25
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: voyage-analytics-api
spec:
  selector:
    app: voyage-analytics-api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
